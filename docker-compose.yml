version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: payout_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payout_db
      POSTGRES_USER: payout_user
      POSTGRES_PASSWORD: payout_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout_user -d payout_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
